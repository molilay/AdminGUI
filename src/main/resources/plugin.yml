name: AdvancedModeratorGUI
version: 2.7.0
main: me.admin.gui.AdvancedModeratorGUI
# Собрано и протестировано против Paper API 1.21.4; работает и на более новых сборках Paper.
api-version: '1.21'
# Плагин использует BukkitScheduler, поэтому на Folia он не запускается.
folia-supported: false
depend: [LuckPerms]
softdepend: [Vault, PlaceholderAPI, AuthMe, ViaVersion, Dynmap, WorldGuard, VoiceChat]

commands:
  mod:
    description: Открыть меню модератора
    aliases: [apanel, adminpanel]
    permission: amgui.use
  sc:
    description: StaffChat — чат модераторов
    aliases: [staffchat]
    permission: amgui.staffchat
  amgui:
    description: Управление плагином
    aliases: [am, admintool]
  report:
    description: Пожаловаться на игрока
    aliases: [репорт, жалоба]
    permission: amgui.report.use
  appeal:
    description: Подать апелляцию на бан
    aliases: [апелляция]
    permission: amgui.appeal.use

permissions:
  amgui.*:
    description: Полный доступ
    default: op
    children:
      amgui.use: true
      amgui.admin: true
      amgui.player: true
      amgui.kick: true
      amgui.ban: true
      amgui.ban.exempt: true
      amgui.kick.exempt: true
      amgui.freeze: true
      amgui.freeze.exempt: true
      amgui.groups: true
      amgui.groups.edit: true
      amgui.groups.assign: true
      amgui.viewip: true
      amgui.geoip: true
      amgui.backup: true
      amgui.backup.create: true
      amgui.backup.restore: true
      amgui.backup.verify: true
      amgui.antiraid: true
      amgui.antiraid.toggle: true
      amgui.antiraid.bypass: true
      amgui.doctor: true
      amgui.inventory.view: true
      amgui.inventory.edit: true
      amgui.logs: true
      amgui.staffchat: true
      amgui.warn: true
      amgui.warn.escalate.ban: true
      amgui.action.undo: true
      amgui.action.undo.others: true
      amgui.mute: true
      amgui.alts: true
      amgui.rollback: true
      amgui.teleport: true
      amgui.notes: true
      amgui.permissions: true
      amgui.permissions.edit: true
      amgui.investigate: true
      amgui.investigation.center: true
      amgui.alert: true
      amgui.announce: true
      amgui.export: true
      amgui.protect: true
      amgui.automod.bypass: true
      amgui.report.use: true
      amgui.report.staff: true
      amgui.vanish: true
      amgui.vanish.see: true
      amgui.appeal.use: true
      amgui.appeal.staff: true
      amgui.coreprotect: true
      amgui.staffmode: true
      amgui.trial.mod: true
      amgui.trial.confirm: true
      amgui.templates: true
      amgui.banwave: true
      amgui.staffkits: true
      amgui.staffactivity: true
      amgui.evidence: true
      amgui.evidence.add: true
      amgui.evidence.remove: true
      amgui.cases: true
      amgui.cases.edit: true
      amgui.cases.assign: true
      amgui.cases.export: true
      amgui.audit: true
      amgui.report.resolve: true
      amgui.report.delete: true
      amgui.automod.view: true
      amgui.automod.edit: true
      amgui.automod.approve: true
      amgui.inbox.view: true
      amgui.inbox.claim: true
      amgui.inbox.takeover: true
      amgui.simulator: true
      amgui.incident.view: true
