name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 21 — целевая версия байткода (Minecraft 1.21.4), 25 — проверка на новом JDK.
        java: ['21', '25']
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      # По умолчанию собирается под Paper API 1.21.4 (минимальная поддерживаемая версия).
      - name: Verify (Paper 1.21.4 API)
        run: mvn --batch-mode --no-transfer-progress clean verify
      - name: Upload plugin
        if: matrix.java == '21'
        uses: actions/upload-artifact@v4
        with:
          name: AdvancedModeratorGUI
          path: target/AdvancedModeratorGUI.jar
          if-no-files-found: error
